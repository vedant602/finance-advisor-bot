<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Finance Advisor Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-lg">
        <h2 class="text-3xl font-extrabold mb-2 text-center text-indigo-600">💰 Finance Advisor</h2>
        <p class="text-center text-gray-500 mb-6">Log in to manage your budget</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="p-3 mb-4 rounded text-white text-sm {% if category == 'danger' %}bg-red-500{% else %}bg-green-500{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block mb-1 text-sm font-semibold text-gray-700">Email Address</label>
                <input type="email" name="email" required class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block mb-1 text-sm font-semibold text-gray-700">Password</label>
                <input type="password" name="password" required class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-bold hover:bg-indigo-700 transition duration-200">Login</button>
        </form>
        <p class="mt-6 text-center text-sm text-gray-600">Don't have an account? <a href="/register" class="text-indigo-600 font-bold underline">Register here</a></p>
    </div>
</body>
</html>
